workflows:
  android-workflow:
    name: Pontaj Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Construire APK
        script: |
          cd $CM_BUILD_DIR
          gradle --no-daemon assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
